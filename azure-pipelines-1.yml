trigger:
- master

variables:
  azureSubscription: 'ca8cbce7-1314-49cb-8f4e-db8b3db5a802'
  webAppName: 'Ganesh'
  environmentName: 'Ganesh'
  vmImageName: 'ubuntu-latest'

stages:

# =====================================================
# BUILD STAGE
# =====================================================

- stage: Build
  displayName: Build Stage

  jobs:

  - job: BuildJob
    displayName: Maven Build Job

    pool:
      vmImage: $(vmImageName)

    steps:

    # Checkout Current Repo Only
    - checkout: self

    # Debug Files
    - script: |
        echo "Source Directory"
        pwd

        echo "All Files"
        ls -R
      displayName: Display Repository Files

    # Maven Package
    - task: Maven@4
      displayName: Maven Package

      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package -DskipTests'
        publishJUnitResults: false
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.8'
        jdkArchitectureOption: 'x64'

    # Verify WAR File
    - script: |
        echo "WAR Files"
        find . -name "*.war"
      displayName: Find WAR File

    # Copy WAR File
    - task: CopyFiles@2
      displayName: Copy WAR File

      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)'
        Contents: '**/*.war'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    # Verify Artifact Files
    - script: |
        echo "Artifact Files"
        ls -R $(Build.ArtifactStagingDirectory)
      displayName: Display Artifact Files

    # Publish Artifact
    - publish: $(Build.ArtifactStagingDirectory)
      artifact: warfile

# =====================================================
# DEPLOY STAGE
# =====================================================

- stage: Deploy
  displayName: Deploy Stage

  dependsOn: Build
  condition: succeeded()

  jobs:

  - deployment: DeployLinuxWebApp
    displayName: Deploy Linux Web App

    environment: $(environmentName)

    pool:
      vmImage: $(vmImageName)

    strategy:
      runOnce:
        deploy:

          steps:

          # Download Artifact
          - download: current
            artifact: warfile

          # Verify Downloaded Artifact
          - script: |
              echo "Downloaded Artifact Files"
              ls -R $(Pipeline.Workspace)
            displayName: Display Downloaded Artifacts

          # Deploy WAR
          - task: AzureWebApp@1
            displayName: Deploy WAR To Azure Web App

            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux
              appName: $(webAppName)
              package: '$(Pipeline.Workspace)/warfile/**/*.war'

# =====================================================
# AUTOMATION TEST STAGE
# =====================================================

- stage: AutomationTests
  displayName: Automation Test Stage

  dependsOn: Deploy
  condition: succeeded()

  jobs:

  - job: RunAutomationTests
    displayName: Run Selenium Tests

    pool:
      vmImage: $(vmImageName)

    steps:

    - checkout: self

    # Run Tests
    - task: Maven@4
      displayName: Run Maven Tests

      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean test'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.8'
        jdkArchitectureOption: 'x64'

    # Publish Results
    - task: PublishTestResults@2
      displayName: Publish Test Results

      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        failTaskOnFailedTests: true