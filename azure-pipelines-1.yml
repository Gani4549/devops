# =====================================================
# Maven Java Web App CI/CD Pipeline
# Azure DevOps Modern Multi-Stage YAML Pipeline
# =====================================================

trigger:
- master

# =====================================================
# Azure Repos Repository
# =====================================================

resources:
  repositories:
    - repository: CommonRepo
      type: git
      name: AzureDemoGanesh/AzureDemoGanesh

# =====================================================
# Variables
# =====================================================

variables:

  # Azure Service Connection
  azureSubscription: 'ca8cbce7-1314-49cb-8f4e-db8b3db5a802'

  # Azure Linux Web App Name
  webAppName: 'Ganesh'

  # Azure DevOps Environment
  environmentName: 'Ganesh'

  # Microsoft Hosted Agent
  vmImageName: 'ubuntu-latest'

# =====================================================
# STAGES
# =====================================================

stages:

# =====================================================
# BUILD STAGE
# =====================================================

- stage: Build
  displayName: Build Stage

  jobs:

  - job: MavenPackageAndPublishArtifacts
    displayName: Maven Package And Publish Artifacts

    pool:
      vmImage: $(vmImageName)

    steps:

    # Checkout Current Repository
    - checkout: self

    # Checkout Azure Repos Repository
    - checkout: CommonRepo

    # Display Repository Files
    - script: |
        echo "Current Working Directory"
        pwd

        echo "Repository Files"
        ls -R $(Build.SourcesDirectory)
      displayName: Display Repository Files

    # Maven Build
    - task: Maven@4
      displayName: Maven Package

      inputs:
        mavenPomFile: '$(Build.SourcesDirectory)/AzureDemoGanesh/pom.xml'
        goals: 'clean package -DskipTests'
        publishJUnitResults: false
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.8'
        jdkArchitectureOption: 'x64'

    # Display Target Folder
    - script: |
        echo "Target Folder Files"
        ls -R $(Build.SourcesDirectory)/AzureDemoGanesh/target
      displayName: Display Target Folder Files

    # Copy WAR File
    - task: CopyFiles@2
      displayName: Copy WAR File To Artifact Staging Directory

      inputs:
        SourceFolder: '$(Build.SourcesDirectory)/AzureDemoGanesh/target'
        Contents: '*.war'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    # Display Artifact Files
    - script: |
        echo "Artifact Staging Directory Files"
        ls -R $(Build.ArtifactStagingDirectory)
      displayName: Display Artifact Files

    # Publish Artifact
    - upload: $(Build.ArtifactStagingDirectory)
      artifact: warfile

# =====================================================
# DEPLOY STAGE
# =====================================================

- stage: Deploy
  displayName: Deploy Stage

  dependsOn: Build
  condition: succeeded()

  jobs:

  # =====================================================
  # DEPLOYMENT JOB
  # =====================================================

  - deployment: DeployLinuxWebApp
    displayName: Deploy Linux Web App

    environment: $(environmentName)

    pool:
      vmImage: $(vmImageName)

    strategy:
      runOnce:
        deploy:

          steps:

          # Download Build Artifact
          - download: current
            artifact: warfile

          # Display Downloaded Artifacts
          - script: |
              echo "Pipeline Workspace Files"
              ls -R $(Pipeline.Workspace)
            displayName: Display Downloaded Artifacts

          # Deploy WAR File To Azure Linux Web App
          - task: AzureWebApp@1
            displayName: Deploy WAR To Azure Web App

            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux
              appName: $(webAppName)
              package: '$(Pipeline.Workspace)/warfile/*.war'

  # =====================================================
  # AUTOMATION TEST JOB
  # =====================================================

  - job: AutomationTests
    displayName: Run Automation Tests

    dependsOn: DeployLinuxWebApp

    pool:
      vmImage: $(vmImageName)

    steps:

    # Checkout Automation Repository
    - checkout: CommonRepo

    # Display Repository Files
    - script: |
        echo "Automation Repository Files"
        ls -R $(Build.SourcesDirectory)
      displayName: Display Automation Repository Files

    # Run Maven Selenium Tests
    - task: Maven@4
      displayName: Run Selenium Tests

      inputs:
        mavenPomFile: '$(Build.SourcesDirectory)/AzureDemoGanesh/pom.xml'
        goals: 'clean test'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.8'
        jdkArchitectureOption: 'x64'

    # Publish Test Results
    - task: PublishTestResults@2
      displayName: Publish Test Results

      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        failTaskOnFailedTests: true